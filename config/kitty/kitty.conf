# Font configuration (optional, use your preferred font)
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Window layout & padding
window_padding_width 10

# Transparency & Blur
background_opacity 0.75
dynamic_background_opacity yes
background_blur 32

# Remote control for theme switching
allow_remote_control yes
listen_on unix:/tmp/kitty

# Base Theme (Catppuccin Mocha)
include theme.conf

# Include dynamic colors from Matugen
include matugen-colors.conf

# Cursor Trail
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrolling
touch_scroll_multiplier 10.0
